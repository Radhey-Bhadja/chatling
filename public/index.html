<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chatling | Private Peer-to-Peer Chat</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-[100dvh] w-screen overflow-hidden bg-slate-50 text-slate-800 font-sans antialiased transition-colors duration-300">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 right-4 sm:top-5 sm:right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-[90vw] sm:max-w-sm"></div>

  <!-- Connection Warning Banner -->
  <div id="connection-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-amber-500 text-white text-[11px] sm:text-xs font-bold py-2 px-4 text-center shadow-md">
    ⚡ Connection offline. Reconnecting...
  </div>

  <!-- HOME VIEW (Room Creation / Join Screen) -->
  <div id="home-view" class="h-full w-full flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bright-hero-bg">
    
    <div class="bright-card w-full max-w-md max-h-[92vh] overflow-y-auto rounded-3xl p-6 sm:p-8 transition-all relative z-10">
      
      <!-- Circular Logo Branding Header -->
      <div class="flex flex-col items-center justify-center text-center mb-6 select-none">
        <div class="circle-logo-frame mb-3 transition-transform duration-300 hover:scale-105">
          <img src="logo.png" alt="Chatling Logo" />
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Chatling</h1>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="flex rounded-2xl bg-slate-100 p-1 mb-6 border border-slate-200">
        <button type="button" id="tab-create" class="flex-1 py-2.5 sm:py-3 text-xs sm:text-sm font-bold rounded-xl bg-emerald-500 text-white shadow-sm transition-all cursor-pointer">
          Create Room
        </button>
        <button type="button" id="tab-join" class="flex-1 py-2.5 sm:py-3 text-xs sm:text-sm font-bold rounded-xl text-slate-600 hover:text-slate-900 transition-all cursor-pointer">
          Join Room
        </button>
      </div>

      <!-- Create Room Section -->
      <div id="section-create" class="space-y-5">
        <div class="text-center p-5 rounded-2xl bg-emerald-50/60 border border-emerald-100 select-none">
          <span class="text-[10px] sm:text-[11px] uppercase tracking-widest font-extrabold text-emerald-700">6-Digit Room Code</span>
          <div id="created-code-display" class="text-3xl sm:text-4xl font-extrabold tracking-widest text-emerald-600 my-2 font-mono">
            ------
          </div>
          <p class="text-xs text-slate-500">Share code with your partner to start chatting.</p>
        </div>

        <button type="button" id="btn-generate-code" class="w-full py-3.5 sm:py-4 px-5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs sm:text-sm rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          Generate Room Code
        </button>

        <div id="create-actions" class="hidden space-y-3 pt-1">
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" id="btn-copy-code" class="py-3 px-3 bg-slate-100 hover:bg-slate-200 border border-slate-200 font-semibold rounded-xl text-xs text-slate-700 transition-all flex items-center justify-center gap-2 cursor-pointer">
              <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              Copy Code
            </button>
            <button type="button" id="btn-copy-link" class="py-3 px-3 bg-slate-100 hover:bg-slate-200 border border-slate-200 font-semibold rounded-xl text-xs text-slate-700 transition-all flex items-center justify-center gap-2 cursor-pointer">
              <svg class="w-4 h-4 text-cyan-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
              </svg>
              Copy Link
            </button>
          </div>

          <button type="button" id="btn-enter-chat" class="w-full py-3.5 sm:py-4 px-5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
            Enter Chat Room
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Join Room Section -->
      <div id="section-join" class="hidden space-y-5">
        <div>
          <label for="join-code-input" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2 select-none">
            Enter 6-Digit Room Code
          </label>
          <input 
            type="text" 
            id="join-code-input" 
            maxlength="6" 
            placeholder="e.g. 839201" 
            class="w-full text-center text-3xl font-mono font-extrabold tracking-widest py-3 px-4 rounded-2xl border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition-all uppercase shadow-inner"
          />
        </div>

        <button type="button" id="btn-join-room" class="w-full py-3.5 sm:py-4 px-5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
          Join Room
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/>
          </svg>
        </button>
      </div>

      <!-- Footer Security Guarantee -->
      <div class="mt-8 pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium select-none flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span>End-to-End Encrypted Peer-to-Peer Chat</span>
      </div>
    </div>
  </div>

  <!-- CHAT VIEW (Chatling Interface) -->
  <div id="chat-view" class="hidden h-full w-full flex flex-col bg-slate-50">

    <!-- Header Bar -->
    <header class="h-16 px-4 sm:px-6 md:px-8 bg-white border-b border-slate-200 flex items-center justify-between shrink-0 shadow-sm z-10 select-none">
      
      <!-- Partner Status & Info -->
      <div class="flex items-center gap-3">
        <!-- Partner Avatar -->
        <div class="relative shrink-0">
          <div class="w-10 h-10 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-700 flex items-center justify-center font-bold text-lg">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <div id="status-indicator" class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-amber-500 border-2 border-white"></div>
        </div>

        <div class="min-w-0">
          <h2 class="font-bold text-slate-900 text-sm leading-tight truncate">Peer Partner</h2>
          <p id="status-text" class="text-xs text-amber-600 font-medium truncate">Connecting to peer...</p>
        </div>
      </div>

      <!-- Header Tools (Code Pill, Theme, Exit) -->
      <div class="flex items-center gap-2">
        <!-- Room Code Pill -->
        <button type="button" id="header-code-pill" title="Click to copy room code" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-mono font-bold text-slate-700 transition-all border border-slate-200 cursor-pointer">
          <span class="text-slate-400 text-[10px] tracking-wider">ROOM:</span>
          <span id="header-room-code" class="text-emerald-600 font-extrabold">------</span>
        </button>

        <!-- Clear Chat Button -->
        <button type="button" id="btn-clear-chat" title="Clear Local Chat" class="p-2 text-slate-500 hover:text-red-600 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>

        <!-- Hidden Theme Toggle Button kept for JS compatibility -->
        <button type="button" id="btn-theme-toggle" class="hidden"></button>

        <!-- Leave Chat Button -->
        <button type="button" id="btn-leave-chat" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white rounded-xl text-xs font-bold transition-all cursor-pointer border border-red-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span class="hidden sm:inline">Leave</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main id="chat-messages" class="flex-1 wa-chat-bg overflow-y-auto p-4 md:px-16 space-y-3">
      
      <!-- Security Disclaimer Banner -->
      <div class="flex justify-center my-3 select-none">
        <div class="bg-white/90 border border-slate-200 text-slate-600 text-xs px-4 py-2 rounded-2xl shadow-sm flex items-center gap-2 max-w-md">
          <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <span>End-to-End P2P Connection • Zero Server Data Logs</span>
        </div>
      </div>

    </main>

    <!-- Typing Indicator Area -->
    <div id="typing-indicator" class="hidden px-6 py-2 text-xs text-emerald-700 font-bold bg-white/90 flex items-center gap-2 border-t border-slate-200 select-none">
      <span>Partner is typing</span>
      <span class="inline-flex gap-0.5">
        <span class="typing-dot">.</span>
        <span class="typing-dot">.</span>
        <span class="typing-dot">.</span>
      </span>
    </div>

    <!-- Input Footer Bar -->
    <footer class="p-3 sm:p-4 bg-white border-t border-slate-200 relative z-20">
      
      <!-- Emoji Picker Popup -->
      <div id="emoji-picker" class="hidden absolute bottom-20 left-4 bg-white border border-slate-200 rounded-3xl shadow-xl p-3 grid grid-cols-5 gap-2 text-2xl z-30 select-none max-w-sm">
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">😊</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">😂</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">❤️</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">👍</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">🎉</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">🔥</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">🙏</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">🚀</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">💯</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">⚡</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">😎</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">👀</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">🤔</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">👏</button>
        <button type="button" class="emoji-btn hover:scale-125 transition-transform cursor-pointer p-1">✨</button>
      </div>

      <div class="flex items-center gap-2.5 max-w-5xl mx-auto">
        <!-- Emoji Toggle Button -->
        <button type="button" id="btn-emoji-toggle" class="p-2.5 text-slate-400 hover:text-emerald-600 hover:bg-slate-100 rounded-full transition-colors cursor-pointer shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>

        <!-- Message Input Field -->
        <input 
          type="text" 
          id="message-input" 
          inputmode="text"
          enterkeyhint="send"
          placeholder="Type a message..." 
          autocomplete="off"
          autocorrect="on"
          capitalize="sentences"
          class="flex-1 py-3 px-5 bg-slate-100 text-slate-900 rounded-full border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-sm transition-all min-w-0 placeholder-slate-400"
        />

        <!-- Send Button -->
        <button type="button" id="btn-send-message" title="Send Message" class="w-11 h-11 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white rounded-full shadow-md transition-all flex items-center justify-center cursor-pointer shrink-0">
          <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>

  </div>

  <!-- Serverless WebRTC PeerJS Script -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Main Application Script -->
  <script src="js/app.js"></script>
</body>
</html>
